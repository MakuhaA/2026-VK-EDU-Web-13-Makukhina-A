{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container">
    <h1>Вопросы по тегу <span style="color: #6a4c93;">#{{ tag }}</span></h1>
    
    <div class="questions-list" style="margin-top: 20px;">
        {% for q in questions %}
            <div style="border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 8px;">
                <h3>{{ q.title }}</h3>
            </div>
        {% empty %}
            <p>По этому тегу пока нет вопросов. Будь первой, кто его задаст!</p>
        {% endfor %}
    </div>
    
    <a href="{% url 'index' %}" style="display: inline-block; margin-top: 20px;">&larr; Назад на главную</a>
</div>
{% endblock %}
