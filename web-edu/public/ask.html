{% extends 'base.html' %}
{% load static %}
{% block extra_head %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
{% endblock %}

{% block content %}
<div class="ask_page">
    <h1 class="situation">Опишите вашу ситуацию</h1>
    <div class="form-field">
        <label for="sizesInputDefault1" class="form-label">Заголовок</label>
        <input class="form-control" type="text" id="sizesInputDefault1" placeholder=""
               aria-label="Default input example">
    </div>

    <div class="form-field">
        <label for="exampleFormControlTextarea2" class="form-label">Текст</label>
        <textarea class="form-control" id="exampleFormControlTextarea2" rows="5"
                  style="color: black;"></textarea>
    </div>

    <div class="form-field">
        <label for="sizesInputDefault2" class="form-label">Теги</label>
        <input class="form-control" type="text" id="sizesInputDefault2" placeholder=""
               aria-label="Default input example">
    </div>

    <div class="form-field">
        <label for="formFile" class="form-label">Добавить картинку</label>
        <input class="form-control" type="file" id="formFile">
    </div>

    <div class="ask">
        <button id="ask_button">Отправить</button>
    </div>
</div>
{% endblock %}
