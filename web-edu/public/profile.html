{% extends 'base.html' %}
{% load static %}
{% block extra_head %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
{% endblock %}

{% block content %}
        <h1 style="font-weight: bold;">Настройки</h1>
        <div class="profile_page">
            <div class="form-field">
                <label for="sizesInputDefault" class="form-label">Login</label>
                <input class="form-control" type="text" id="sizesInputDefault" placeholder=""
                       aria-label="Default input example">
            </div>
            <div class="form-field">
                <label for="exampleFormControlInput1" class="form-label">Email address</label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
            </div>
            <div class="form-field">
                <label for="sizesInputDefault" class="form-label">NickName</label>
                <input class="form-control" type="text" id="sizesInputDefault" placeholder=""
                       aria-label="Default input example">
            </div>
            <div class="avatar-uploader">
                <label class="avatar-label">Upload avatar</label>

                <div class="avatar-preview" id="avatar-preview">
                    <span class="avatar-placeholder">avatar</span>
                </div>

                <div class="file-inputs">
                    <input type="file" id="avatar-file" accept="image/*" style="display: none;">

                    <div class="custom-file-row">
                        <label for="avatar-file" class="file-name-box" id="file-name-display">c:\avatar.jpg</label>
                        <label for="avatar-file" class="choose-btn">choose</label>
                    </div>
                </div>

                <button type="button" class="save-btn">Save</button>
            </div>
        </div>
{% endblock %}
