{% load static %}

<div class="card mb-3 answer-card">
    <div class="card-body">
        <div class="body-answer">
            <img src="{% static 'img/аватар.png' %}" alt="аватар" class="avatar_image">
            <p class="card-text answer-text">{{ answer.text }}</p>
        </div>

        <div class="card-footer answer-footer">
            <p class="card-text"><small class="fg-2 answer-date">{{ answer.created_at }}</small></p>

            <div class="form-field check-field">
                <input type="checkbox" id="checksuccess_{{ answer.id }}" class="check theme-success"/>
                <label for="checksuccess_{{ answer.id }}">Правильный ответ</label>
            </div>

            <div class="reactions" data-id="a{{ answer.id }}">
                <button type="button" class="reaction reaction--like">
                    <img src="{% static 'img/thumbs-up.png' %}" alt="" class="reaction__icon">
                    <span class="reaction__count">0</span>
                </button>
                <button type="button" class="reaction reaction--dislike">
                    <img src="{% static 'img/thumbs-down.png' %}" alt="" class="reaction__icon">
                    <span class="reaction__count">0</span>
                </button>
            </div>
        </div>
    </div>
</div>
