<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Арканум</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="public/static/css/style.css">
    <link rel="icon" href="public/static/img/icon.png" type="image/png">
</head>

<body>

<header class="site-header">
    <a href="index.html" class="header-logo">
        <div class="logotype">
            <img src="public/static/img/icon.png" alt="лого" class="logo_image">
        </div>

        <span class="zag">Арканум</span>
    </a>

    <div class="header-research">
        <input type="search" placeholder="поиск">
        <button class="search_button" type="button"><span>Поиск</span></button>
    </div>

    <div class="user">
        <div class="avatar">
            <img src="public/static/img/аватар.png" alt="Аватар" class="avatar_image">
        </div>
        <div class="user_action">
            <span class="name">Имя Фамилия</span>
            <div>
                 <a href="profile.html"><button class="user_button" type="button"><span>Настойки</span></button></a>
                <a href=""><button class="user_button" type="button"><span>Выход</span></button></a>
            </div>
        </div>
    </div>
</header>

<div class="main-wrapper">
    <main class="main-content">
        <h1 style="font-weight: bold;">Настройки</h1>
        <div class="profile_page">
            <div class="form-field">
                <label for="sizesInputDefault" class="form-label">Login</label>
                <input class="form-control" type="text" id="sizesInputDefault" placeholder=""
                       aria-label="Default input example">
            </div>
            <div class="form-field">
                <label for="exampleFormControlInput1" class="form-label">Email address</label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
            </div>
            <div class="form-field">
                <label for="sizesInputDefault" class="form-label">NickName</label>
                <input class="form-control" type="text" id="sizesInputDefault" placeholder=""
                       aria-label="Default input example">
            </div>
            <div class="avatar-uploader">
                <label class="avatar-label">Upload avatar</label>

                <div class="avatar-preview" id="avatar-preview">
                    <span class="avatar-placeholder">avatar</span>
                </div>

                <div class="file-inputs">
                    <input type="file" id="avatar-file" accept="image/*" style="display: none;">

                    <div class="custom-file-row">
                        <label for="avatar-file" class="file-name-box" id="file-name-display">c:\avatar.jpg</label>
                        <label for="avatar-file" class="choose-btn">choose</label>
                    </div>
                </div>

                <button type="button" class="save-btn">Save</button>
            </div>
        </div>


    </main>
    <aside class="sidebar">
        <div class="sidebar_block">
            <h2 class="sidebar-title">Популярные тэги</h2>
            <ul class="sidebar-menu">
                <li><a href="#">#любовь</a></li>
                <li><a href="#">#расклад</a></li>
                <li><a href="#">#помощь</a></li>
                <li><a href="#">#приворот</a></li>
            </ul>
        </div>
        <div class="sidebar_block">
            <h2 class="sidebar-title">Лучшие знатоки</h2>
            <ul class="top-users">
                <li><a href="#">Галина</a></li>
                <li><a href="#">Ванга№2</a></li>
                <li><a href="#">Уэйт</a></li>
                <li><a href="#">Ленорман</a></li>
            </ul>
        </div>
    </aside>

</div>
<script src="public/static/js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
